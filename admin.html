<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>የኢንስፔክሽን መመሪያ ፈተና ስርዓት</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI','Noto Sans Ethiopic',Tahoma,sans-serif;background:linear-gradient(135deg,#1a56db,#7c3aed);min-height:100vh;padding:20px;}
        .container{max-width:1400px;margin:0 auto;}
        /* መግቢያ ገጽ */
        .welcome-card{background:#fff;border-radius:30px;padding:40px;text-align:center;max-width:500px;margin:50px auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
        .welcome-card h1{color:#1a56db;margin-bottom:15px;}
        .btn{display:block;width:100%;padding:15px;margin:12px 0;border:none;border-radius:15px;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:0.3s;}
        .btn-admin{background:#1a56db;color:#fff;}
        .btn-exam{background:#059669;color:#fff;}
        /* አድሚን ፓነል */
        .header{background:#fff;border-radius:20px;padding:20px;margin-bottom:25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px;}
        .tab{background:#fff;border:none;padding:12px 25px;border-radius:50px;cursor:pointer;font-weight:bold;transition:0.3s;}
        .tab.active{background:#1a56db;color:#fff;}
        .card{background:#fff;border-radius:20px;padding:25px;margin-bottom:25px;box-shadow:0 5px 20px rgba(0,0,0,0.08);}
        .form-group{margin-bottom:18px;}
        .form-group label{display:block;margin-bottom:8px;font-weight:bold;}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:12px;font-size:1rem;}
        .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;}
        .btn-primary{background:#1a56db;color:#fff;}
        .btn-success{background:#059669;color:#fff;}
        .btn-danger{background:#dc2626;color:#fff;}
        .btn-warning{background:#ed8936;color:#fff;}
        table{width:100%;border-collapse:collapse;}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #e0e0e0;}
        th{background:#f7fafc;}
        .badge{padding:4px 12px;border-radius:20px;font-size:0.8rem;}
        .badge-success{background:#d1fae5;color:#065f46;}
        .badge-danger{background:#fee2e2;color:#991b1b;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:25px;}
        .stat-card{background:#fff;padding:20px;border-radius:15px;text-align:center;}
        .stat-card h2{font-size:2rem;color:#1a56db;}
        .timer{font-size:2rem;font-weight:bold;text-align:center;color:#dc2626;margin-bottom:20px;}
        .option{padding:12px;border:2px solid #e0e0e0;border-radius:12px;margin:8px 0;cursor:pointer;}
        .option.selected{border-color:#1a56db;background:#eff6ff;}
        .progress-bar{background:#e0e0e0;border-radius:10px;height:10px;margin:15px 0;}
        .progress-fill{background:#059669;height:10px;border-radius:10px;width:0%;}
        .toast{position:fixed;bottom:30px;right:30px;background:#333;color:#fff;padding:12px 24px;border-radius:10px;z-index:1000;}
        .hidden{display:none;}
        @media (max-width:768px){.card{padding:18px;}.timer{font-size:1.5rem;}}
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- መግቢያ ገጽ -->
    <div id="welcomeScreen">
        <div class="welcome-card">
            <h1>🎓 የኢንስፔክሽን መመሪያ ፈተና ስርዓት</h1>
            <p>መመሪያ ቁጥር 009/2011</p>
            <button class="btn btn-admin" onclick="showAdminLogin()">🔑 አድሚን</button>
            <button class="btn btn-exam" onclick="showExamLogin()">📝 ተፈታኝ</button>
        </div>
    </div>

    <!-- አድሚን ሎጂን -->
    <div id="adminLoginScreen" class="hidden">
        <div class="card" style="max-width:400px;margin:50px auto;">
            <h2>🔐 የአድሚን መግቢያ</h2>
            <div class="form-group"><label>የይለፍ ቃል</label><input type="password" id="adminPassword" placeholder="11133"></div>
            <button class="btn btn-primary" onclick="adminLogin()">ግባ</button>
            <button class="btn btn-warning" onclick="goBack()">ተመለስ</button>
        </div>
    </div>

    <!-- አድሚን ፓነል -->
    <div id="adminPanel" class="hidden">
        <div class="header"><h1>🎓 አድሚን ፓነል</h1><button class="btn btn-warning" onclick="logout()">🚪 ውጣ</button></div>
        <div class="tabs">
            <button class="tab active" onclick="showAdminTab('dashboard',this)">📊 ዳሽቦርድ</button>
            <button class="tab" onclick="showAdminTab('create',this)">➕ ፈተና ፍጠር</button>
            <button class="tab" onclick="showAdminTab('bank',this)">📚 ጥያቄ ባንክ</button>
            <button class="tab" onclick="showAdminTab('examinees',this)">👥 ተፈታኞች</button>
            <button class="tab" onclick="showAdminTab('results',this)">📊 ውጤቶች</button>
            <button class="tab" onclick="showAdminTab('recycle',this)">🗑️ ሪሳይክል</button>
        </div>
        <div id="adminDashboardTab"><div class="stats-grid" id="statsGrid"></div><div class="card"><h3>📋 የተፈጠሩ ፈተናዎች</h3><div id="examsList"></div></div></div>
        <div id="adminCreateTab" class="hidden"><div class="card"><h3>➕ አዲስ ፈተና</h3><div class="form-group"><label>ርዕስ</label><input type="text" id="examTitle" placeholder="ለምሳሌ: ኢንስፔክሽን ፈተና"></div><div class="form-row"><div class="form-group"><label>ምርጫ (1-30)</label><input type="number" id="mcqCount" min="1" max="30" value="10"></div><div class="form-group"><label>ዳሽ ሙላ (1-10)</label><input type="number" id="fillCount" min="0" max="10" value="5"></div><div class="form-group"><label>አጭር መልስ (1-10)</label><input type="number" id="shortCount" min="0" max="10" value="5"></div></div><div class="form-row"><div class="form-group"><label>ጊዜ/ጥያቄ (ደቂቃ)</label><input type="number" id="timePerQ" min="1" max="5" value="2"></div><div class="form-group"><label>ምርጫ ክብደት</label><input type="number" id="mcqWeight" value="5"></div><div class="form-group"><label>ዳሽ ሙላ ክብደት</label><input type="number" id="fillWeight" value="10"></div><div class="form-group"><label>አጭር መልስ ክብደት</label><input type="number" id="shortWeight" value="15"></div></div><button class="btn btn-primary" onclick="createExam()">🚀 ፈተና ፍጠር</button><div id="newExamLink" class="hidden" style="margin-top:15px;"><strong>🔗 ሊንክ፦</strong><input type="text" id="examLinkInput" readonly><button onclick="copyLink()">📋 ቅዳ</button></div></div></div>
        <div id="adminBankTab" class="hidden"><div class="card"><h3>📚 የጥያቄ ባንክ አስተዳደር</h3><div class="form-row"><div class="form-group"><label>ዓይነት</label><select id="qType"><option value="mcq">ምርጫ</option><option value="fill">ዳሽ ሙላ</option><option value="short">አጭር መልስ</option></select></div><div class="form-group"><label>ጥያቄ</label><textarea id="newQuestion" rows="2" placeholder="ጥያቄውን ያስገቡ"></textarea></div></div><div class="form-row" id="mcqOptionsDiv"><div class="form-group"><label>አማራጭ ሀ</label><input type="text" id="optA" placeholder="አማራጭ ሀ"></div><div class="form-group"><label>አማራጭ ለ</label><input type="text" id="optB" placeholder="አማራጭ ለ"></div><div class="form-group"><label>አማራጭ ሐ</label><input type="text" id="optC" placeholder="አማራጭ ሐ"></div><div class="form-group"><label>አማራጭ መ</label><input type="text" id="optD" placeholder="አማራጭ መ"></div></div><div class="form-group"><label>ትክክለኛ መልስ (ለምርጫ:0-3, ለሌሎች:ጽሁፍ)</label><input type="text" id="correctAnswer" placeholder="ለምርጫ ቁጥር(0-3) ለሌሎች ጽሁፍ"></div><div class="form-group"><label>ማጣቀሻ (ገጽ እና ክፍል)</label><input type="text" id="refPage" placeholder="ለምሳሌ: ገጽ 4, ክፍል 1.2"></div><div class="form-row"><div class="form-group"><label>ከJSON ኢምፖርት</label><input type="file" id="jsonImport" accept=".json"></div><div class="form-group"><label>ከWord ኢምፖርት</label><input type="file" id="wordImport" accept=".txt,.docx"></div></div><button class="btn btn-success" onclick="addQuestion()">➕ ጥያቄ ጨምር</button><button class="btn btn-primary" onclick="exportQuestions()">💾 ጥያቄዎችን ማስቀመጫ</button><hr><h4>📋 ነባር ጥያቄዎች (30 ምርጫ፣10 ዳሽ ሙላ፣10 አጭር)</h4><div id="bankStats"></div><div id="bankList" style="max-height:400px;overflow:auto;"></div></div></div>
        <div id="adminExamineesTab" class="hidden"><div class="card"><h3>👥 ተፈታኞች መመዝገብ</h3><div class="form-row"><div class="form-group"><label>ስም</label><input type="text" id="examineeName" placeholder="ሙሉ ስም"></div><div class="form-group"><label>ፈተና</label><select id="examSelect"></select></div></div><button class="btn btn-success" onclick="generateOTP()">🔑 OTP አመንጭ</button><div id="otpResult"></div></div><div class="card"><h3>📋 የተመዘገቡ ተፈታኞች</h3><input type="text" id="searchExaminee" placeholder="🔍 ፈልግ" style="width:100%;padding:10px;margin-bottom:15px;" oninput="filterExaminees()"><div id="examineesList"></div></div></div>
        <div id="adminResultsTab" class="hidden"><div class="card"><h3>📊 ውጤቶች</h3><input type="text" id="searchResult" placeholder="🔍 ፈልግ" style="width:100%;padding:10px;margin-bottom:15px;" oninput="filterResults()"><div id="resultsList"></div></div></div>
        <div id="adminRecycleTab" class="hidden"><div class="card"><h3>🗑️ ሪሳይክል ቢን</h3><button class="btn btn-success" onclick="restoreAll()">♻️ ሁሉንም መልስ</button><button class="btn btn-danger" onclick="emptyRecycle()">🗑️ ሙሉ ማጥፊያ</button><div id="recycleList"></div></div></div>
    </div>

    <!-- ተፈታኝ ሎጂን -->
    <div id="examLoginScreen" class="hidden"><div class="card" style="max-width:500px;margin:50px auto;"><h2>🔐 የፈተና መግቢያ</h2><div class="form-group"><label>4-አሃዝ OTP</label><input type="text" id="examOtp" placeholder="0000" style="text-align:center;font-size:1.5rem;letter-spacing:5px;"></div><button class="btn btn-primary" onclick="verifyOTP()">✅ ወደ ፈተና ግባ</button><button class="btn btn-warning" onclick="goBack()">🔙 ተመለስ</button></div></div>

    <!-- ተፈታኝ ፈተና ገጽ -->
    <div id="examScreen" class="hidden"><div class="card"><div class="timer" id="timerDisplay">⏱️ 00:00</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div id="questionsContainer"></div><button class="btn btn-success" style="width:100%;margin-top:20px;" onclick="submitExam()">✅ ፈተና አስጨርስ</button></div></div>
</div>

<script>
    // ==================== የጥያቄ ባንክ (ከፒዲኤፍ መሰረት - 30 ምርጫ፣10 ዳሽ ሙላ፣10 አጭር) ====================
    let questionBank = {
        mcq: [],
        fill: [],
        short: []
    };
    
    // ነባር ጥያቄዎች ከመመሪያው በመነሳት
    function initDefaultQuestions() {
        // 30 ምርጫ ጥያቄዎች
        for(let i=1;i<=30;i++){
            questionBank.mcq.push({
                id:`mcq${i}`,question:`ለምሳሌ ምርጫ ጥያቄ ${i}: ከመመሪያው ክፍል የተወሰደ`,options:['አማራጭ ሀ','አማራጭ ለ','አማራጭ ሐ','አማራጭ መ'],correct:0,page:'ገጽ ተመዝግቧል',section:'ክፍል',explanation:'ዝርዝር ማብራሪያ'
            });
        }
        // 10 ዳሽ ሙላ
        for(let i=1;i<=10;i++){
            questionBank.fill.push({id:`fill${i}`,question:`ለምሳሌ ዳሽ ሙላ ${i}: _____ ትክክለኛውን ይሙሉ`,correct:'ምሳሌ መልስ',page:'ገጽ',section:'ክፍል',explanation:'ማብራሪያ'});
        }
        // 10 አጭር መልስ
        for(let i=1;i<=10;i++){
            questionBank.short.push({id:`short${i}`,question:`ለምሳሌ አጭር መልስ ${i}: በአጭሩ ይግለጹ`,correct:'ምሳሌ ትክክለኛ መልስ',page:'ገጽ',section:'ክፍል',explanation:'ማብራሪያ',keywords:['ቁልፍ','ቃል']});
        }
    }
    
    // የተጠቃሚ ውሂብ
    let exams = JSON.parse(localStorage.getItem('exams') || '[]');
    let examinees = JSON.parse(localStorage.getItem('examinees') || '[]');
    let results = JSON.parse(localStorage.getItem('results') || '[]');
    let recycleBin = JSON.parse(localStorage.getItem('recycleBin') || '[]');
    let bank = JSON.parse(localStorage.getItem('questionBank'));
    if(bank && bank.mcq && bank.mcq.length>0) questionBank = bank;
    else { initDefaultQuestions(); saveBank(); }
    
    function saveBank(){ localStorage.setItem('questionBank',JSON.stringify(questionBank)); }
    function saveAll(){ localStorage.setItem('exams',JSON.stringify(exams)); localStorage.setItem('examinees',JSON.stringify(examinees)); localStorage.setItem('results',JSON.stringify(results)); localStorage.setItem('recycleBin',JSON.stringify(recycleBin)); saveBank(); }
    
    let currentExamForStudent=null, currentExamineeData=null, studentAnswers={}, examTimer=null, examTimeLeft=0, examQuestionsList=[];
    
    function showToast(msg,type='success'){let t=document.createElement('div');t.className='toast';t.style.background=type==='error'?'#dc2626':'#059669';t.innerText=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
    function goBack(){document.getElementById('welcomeScreen').classList.remove('hidden');document.getElementById('adminLoginScreen').classList.add('hidden');document.getElementById('adminPanel').classList.add('hidden');document.getElementById('examLoginScreen').classList.add('hidden');document.getElementById('examScreen').classList.add('hidden');}
    function logout(){goBack();}
    function showAdminLogin(){document.getElementById('welcomeScreen').classList.add('hidden');document.getElementById('adminLoginScreen').classList.remove('hidden');}
    function showExamLogin(){document.getElementById('welcomeScreen').classList.add('hidden');document.getElementById('examLoginScreen').classList.remove('hidden');}
    function adminLogin(){let pwd=document.getElementById('adminPassword').value;if(pwd==='11133'){document.getElementById('adminLoginScreen').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');showAdminTab('dashboard',document.querySelector('#adminPanel .tab'));loadAdminData();showToast('እንኳን ደህና መጡ አድሚን');}else showToast('የይለፍ ቃል ተሳስቷል! (11133)','error');}
    function showAdminTab(tab,btn){document.querySelectorAll('#adminPanel .tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');['dashboard','create','bank','examinees','results','recycle'].forEach(t=>{document.getElementById(`admin${t.charAt(0).toUpperCase()+t.slice(1)}Tab`).classList.add('hidden');});document.getElementById(`admin${tab.charAt(0).toUpperCase()+tab.slice(1)}Tab`).classList.remove('hidden');if(tab==='dashboard')loadAdminData();if(tab==='examinees')loadExaminees();if(tab==='results')loadResults();if(tab==='recycle')loadRecycle();if(tab==='bank')loadBankUI();}
    
    function loadAdminData(){let stats={exams:exams.length,examinees:examinees.length,results:results.length,passed:results.filter(r=>r.percentage>=50).length};document.getElementById('statsGrid').innerHTML=`<div class="stat-card"><h2>${stats.exams}</h2><p>ፈተናዎች</p></div><div class="stat-card"><h2>${stats.examinees}</h2><p>ተፈታኞች</p></div><div class="stat-card"><h2>${stats.results}</h2><p>ውጤቶች</p></div><div class="stat-card"><h2>${stats.passed}</h2><p>ያለፉ</p></div>`;let html='<table><thead><tr><th>ርዕስ</th><th>ጥያቄ</th><th>ጊዜ</th><th>ሁኔታ</th></tr></thead><tbody>';exams.forEach(e=>{html+=`<tr><td>${e.title}</td><td>${e.totalQ}</td><td>${e.totalTime} ደቂቃ</td><td><span class="badge badge-success">ንቁ</span></td></tr>`;});html+='</tbody></table>';document.getElementById('examsList').innerHTML=html||'<p>ምንም ፈተና የለም</p>';}
    function updateExamSelect(){let s=document.getElementById('examSelect');s.innerHTML='<option value="">-- ምረጥ --</option>';exams.forEach(e=>{s.innerHTML+=`<option value="${e.id}">${e.title}</option>`;});}
    
    function createExam(){let title=document.getElementById('examTitle').value.trim();if(!title){showToast('ርዕስ ያስገቡ','error');return;}let mcqC=parseInt(document.getElementById('mcqCount').value)||10,fillC=parseInt(document.getElementById('fillCount').value)||5,shortC=parseInt(document.getElementById('shortCount').value)||5;let tQ=mcqC+fillC+shortC,tTime=tQ*(parseInt(document.getElementById('timePerQ').value)||2);let shuffledMcq=[...questionBank.mcq].sort(()=>0.5-Math.random()),shuffledFill=[...questionBank.fill].sort(()=>0.5-Math.random()),shuffledShort=[...questionBank.short].sort(()=>0.5-Math.random());let exam={id:Date.now().toString(),title,createdAt:new Date().toISOString(),totalQ:tQ,totalTime:tTime,mcqCount:mcqC,fillCount:fillC,shortCount:shortC,mcqWeight:parseInt(document.getElementById('mcqWeight').value)||5,fillWeight:parseInt(document.getElementById('fillWeight').value)||10,shortWeight:parseInt(document.getElementById('shortWeight').value)||15,questions:{mcq:shuffledMcq.slice(0,mcqC),fill:shuffledFill.slice(0,fillC),short:shuffledShort.slice(0,shortC)}};exams.push(exam);saveAll();showToast('ፈተና ተፈጥሯል!');loadAdminData();updateExamSelect();let link=window.location.href.split('?')[0];document.getElementById('examLinkInput').value=link;document.getElementById('newExamLink').classList.remove('hidden');}
    function copyLink(){let i=document.getElementById('examLinkInput');i.select();document.execCommand('copy');showToast('ሊንክ ተቅዷል');}
    
    function generateOTP(){let name=document.getElementById('examineeName').value.trim(),examId=document.getElementById('examSelect').value;if(!name||!examId){showToast('ስም እና ፈተና ይምረጡ','error');return;}let otp=Math.floor(1000+Math.random()*9000).toString();let exam=exams.find(e=>e.id===examId);examinees.push({id:Date.now().toString(),name,examId,examTitle:exam.title,otp,used:false,createdAt:new Date().toISOString()});saveAll();document.getElementById('otpResult').innerHTML=`<div style="background:#d1fae5;padding:15px;border-radius:12px;margin-top:15px;"><strong>${name}</strong><br>🔑 OTP: <span style="font-size:2rem;font-weight:bold;letter-spacing:5px;">${otp}</span><br><button class="btn btn-primary" onclick="navigator.clipboard.writeText('${otp}')">📋 ቅዳ</button></div>`;loadExaminees();showToast('OTP ተፈጥሯል');}
    function loadExaminees(){let html='<table><thead><tr><th>ስም</th><th>ፈተና</th><th>OTP</th><th>ሁኔታ</th></tr></thead><tbody>';examinees.forEach(e=>{html+=`<tr><td>${e.name}</td><td>${e.examTitle}</td><td><code>${e.otp}</code></td><td>${e.used?'<span class="badge badge-danger">ተጠቅሟል</span>':'<span class="badge badge-success">ንቁ</span>'}</td></tr>`;});html+='</tbody></table>';document.getElementById('examineesList').innerHTML=html||'<p>ምንም የለም</p>';}
    function filterExaminees(){let s=document.getElementById('searchExaminee').value.toLowerCase();let f=examinees.filter(e=>e.name.toLowerCase().includes(s));let html='<table><thead><tr><th>ስም</th><th>ፈተና</th><th>OTP</th><th>ሁኔታ</th></tr></thead><tbody>';f.forEach(e=>{html+=`<tr><td>${e.name}</td><td>${e.examTitle}</td><td><code>${e.otp}</code></td><td>${e.used?'<span class="badge badge-danger">ተጠቅሟል</span>':'<span class="badge badge-success">ንቁ</span>'}</td></tr>`;});html+='</tbody></table>';document.getElementById('examineesList').innerHTML=html;}
    function loadResults(){let html='<table><thead><tr><th>ተፈታኝ</th><th>ፈተና</th><th>ውጤት</th><th>ቀን</th><th>ዝርዝር</th></tr></thead><tbody>';results.forEach(r=>{html+=`<tr><td>${r.studentName}</td><td>${r.examTitle}</td><td><span class="badge ${r.percentage>=50?'badge-success':'badge-danger'}">${r.percentage.toFixed(1)}%</span></td><td>${new Date(r.submittedAt).toLocaleDateString()}</td><td><details><summary>👁️</summary><div style="max-height:150px;overflow:auto;">${r.detailsHtml||'ዝርዝር የለም'}</div></details></td></tr>`;});html+='</tbody></table>';document.getElementById('resultsList').innerHTML=html||'<p>ምንም ውጤት የለም</p>';}
    function filterResults(){let s=document.getElementById('searchResult').value.toLowerCase();let f=results.filter(r=>r.studentName.toLowerCase().includes(s));let html='<table><thead><tr><th>ተፈታኝ</th><th>ፈተና</th><th>ውጤት</th><th>ቀን</th></tr></thead><tbody>';f.forEach(r=>{html+=`<tr><td>${r.studentName}</td><td>${r.examTitle}</td><td><span class="badge ${r.percentage>=50?'badge-success':'badge-danger'}">${r.percentage.toFixed(1)}%</span></td><td>${new Date(r.submittedAt).toLocaleDateString()}</td></tr>`;});html+='</tbody></table>';document.getElementById('resultsList').innerHTML=html;}
    function loadRecycle(){let html='</table><thead><tr><th>ስም</th><th>ውጤት</th><th>የተጠፋ</th><th>ድርጊት</th></tr></thead><tbody>';recycleBin.forEach(r=>{html+=`<tr><td>${r.studentName}</td><td>${r.percentage.toFixed(1)}%</td                <td>${r.deletedAt}</td>.<button class="btn btn-success btn-sm" onclick="restoreResult('${r.id}')">♻️</button></td
            </tr>`;});html+='</tbody></td>';document.getElementById('recycleList').innerHTML=html||'<p>ባዶ ነው</p>';}
    function restoreResult(id){let item=recycleBin.find(r=>r.id===id);if(item){delete item.deletedAt;results.push(item);recycleBin=recycleBin.filter(r=>r.id!==id);saveAll();loadResults();loadRecycle();showToast('ተመልሷል');}}
    function restoreAll(){recycleBin.forEach(r=>{delete r.deletedAt;results.push(r);});recycleBin=[];saveAll();loadResults();loadRecycle();showToast('ሁሉም ተመልሰዋል');}
    function emptyRecycle(){if(confirm('ሙሉ ማጥፋት ቋሚ ነው!')){recycleBin=[];saveAll();loadRecycle();showToast('ሪሳይክል ተጠራግሟል');}}
    
    // ጥያቄ ባንክ አስተዳደር
    function loadBankUI(){document.getElementById('bankStats').innerHTML=`<p>✅ ምርጫ: ${questionBank.mcq.length} | 📝 ዳሽ ሙላ: ${questionBank.fill.length} | ✍️ አጭር: ${questionBank.short.length}</p>`;let html='';[...questionBank.mcq,...questionBank.fill,...questionBank.short].forEach(q=>{html+=`<div style="border-bottom:1px solid #ddd;padding:8px;"><strong>${q.question.substring(0,80)}</strong><br><span style="font-size:0.8rem;">${q.page||''} ${q.section||''}</span><button class="btn btn-danger btn-sm" style="float:right;" onclick="deleteQuestion('${q.id}')">🗑️</button></div>`;});document.getElementById('bankList').innerHTML=html;}
    function addQuestion(){let type=document.getElementById('qType').value,text=document.getElementById('newQuestion').value.trim();if(!text){showToast('ጥያቄ ያስገቡ','error');return;}let newId=type+Date.now();let newQ={id:newId,question:text,page:document.getElementById('refPage').value||'ገጽ አልተገለጸም',section:'ክፍል',explanation:'ከመመሪያው የተወሰደ'};if(type==='mcq'){let opts=[document.getElementById('optA').value,document.getElementById('optB').value,document.getElementById('optC').value,document.getElementById('optD').value];if(opts.some(o=>!o)){showToast('4ቱም አማራጮች ይሙሉ','error');return;}newQ.options=opts;newQ.correct=parseInt(document.getElementById('correctAnswer').value)||0;}else{newQ.correct=document.getElementById('correctAnswer').value.trim();if(type==='short')newQ.keywords=[newQ.correct];}questionBank[type].push(newQ);saveBank();loadBankUI();showToast('ጥያቄ ተጨምሯል');}
    function deleteQuestion(id){for(let t of['mcq','fill','short']){let idx=questionBank[t].findIndex(q=>q.id===id);if(idx!==-1){questionBank[t].splice(idx,1);saveBank();loadBankUI();showToast('ተጥፏል');return;}}}
    function exportQuestions(){let blob=new Blob([JSON.stringify(questionBank,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`questions_${new Date().toISOString().slice(0,19)}.json`;a.click();showToast('ተቀምጧል');}
    document.getElementById('jsonImport')?.addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{try{let imported=JSON.parse(ev.target.result);if(imported.mcq)questionBank=imported;saveBank();loadBankUI();showToast('ኢምፖርት ተሳክቷል');}catch(ex){showToast('ከJSON ኢምፖርት አልተሳካም','error');}};reader.readAsText(file);});
    
    // ተፈታኝ ክፍል
    async function verifyOTP(){let otp=document.getElementById('examOtp').value.trim();let ex=examinees.find(e=>e.otp===otp&&!e.used);if(!ex){showToast('የማይሰራ OTP!','error');return;}let exam=exams.find(e=>e.id===ex.examId);if(!exam){showToast('ፈተና አልተገኘም','error');return;}currentExamineeData=ex;currentExamForStudent=exam;if(confirm(`📋 ፈተና: ${exam.title}\n❓ ጥያቄዎች: ${exam.totalQ}\n⏰ ጊዜ: ${exam.totalTime} ደቂቃ\n\nመጀመር ይፈልጋሉ?`)){startExamForStudent();}}
    function startExamForStudent(){let idx=examinees.findIndex(e=>e.id===currentExamineeData.id);if(idx!==-1)examinees[idx].used=true;saveAll();buildStudentQuestions();examTimeLeft=currentExamForStudent.totalTime*60;document.getElementById('examLoginScreen').classList.add('hidden');document.getElementById('examScreen').classList.remove('hidden');renderStudentExam();startStudentTimer();}
    function buildStudentQuestions(){examQuestionsList=[];let qNum=1;currentExamForStudent.questions.mcq.forEach(q=>{examQuestionsList.push({...q,type:'mcq',num:qNum++,weight:currentExamForStudent.mcqWeight});});currentExamForStudent.questions.fill.forEach(q=>{examQuestionsList.push({...q,type:'fill',num:qNum++,weight:currentExamForStudent.fillWeight});});currentExamForStudent.questions.short.forEach(q=>{examQuestionsList.push({...q,type:'short',num:qNum++,weight:currentExamForStudent.shortWeight});});}
    function renderStudentExam(){let html='';examQuestionsList.forEach(q=>{let saved=studentAnswers[q.num];html+=`<div style="margin-bottom:25px;padding:15px;border-bottom:1px solid #ddd;"><h4>${q.num}. ${q.question} <span style="color:#059669;">(${q.weight} ነጥብ)</span></h4>`;if(q.type==='mcq'){html+=`<div class="options">`;let letters=['ሀ','ለ','ሐ','መ'];q.options.forEach((opt,i)=>{html+=`<div class="option ${saved===i?'selected':''}" onclick="selectStudentOption(${q.num},${i},this)"><input type="radio" name="q-${q.num}" ${saved===i?'checked':''}> <label>${letters[i]}) ${opt}</label></div>`;});html+=`</div>`;}else if(q.type==='fill'){html+=`<input type="text" class="form-group" style="width:100%;padding:12px;" placeholder="መልስዎ..." value="${saved||''}" oninput="saveStudentAnswer(${q.num},this.value)">`;}else{html+=`<textarea rows="3" style="width:100%;padding:12px;" placeholder="መልስዎ በዝርዝር..." oninput="saveStudentAnswer(${q.num},this.value)">${saved||''}</textarea>`;}html+=`</div>`;});document.getElementById('questionsContainer').innerHTML=html;updateStudentProgress();}
    function selectStudentOption(qNum,idx,el){studentAnswers[qNum]=idx;let parent=el.closest('.options');if(parent)parent.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');if(el.querySelector('input'))el.querySelector('input').checked=true;updateStudentProgress();}
    function saveStudentAnswer(qNum,val){studentAnswers[qNum]=val;updateStudentProgress();}
    function updateStudentProgress(){let answered=Object.keys(studentAnswers).length,total=examQuestionsList.length;let percent=(answered/total)*100;let pf=document.getElementById('progressFill');if(pf)pf.style.width=percent+'%';}
    function startStudentTimer(){updateStudentTimer();examTimer=setInterval(()=>{examTimeLeft--;updateStudentTimer();if(examTimeLeft<=0){clearInterval(examTimer);showToast('⏰ ጊዜ አልቋል! ፈተና ተልኳል');submitExam();}},1000);}
    function updateStudentTimer(){let mins=Math.floor(examTimeLeft/60),secs=examTimeLeft%60;let td=document.getElementById('timerDisplay');if(td){td.innerHTML=`⏱️ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;if(examTimeLeft<=60)td.style.color='#dc2626';}}
    function submitExam(){if(examTimer)clearInterval(examTimer);let totalScore=0,maxScore=0,detailsHtml='';for(let q of examQuestionsList){let user=studentAnswers[q.num];let isCorrect=false,userText='',correctText='';if(q.type==='mcq'){correctText=q.options[q.correct];userText=(user!==undefined)?q.options[user]:'አልተመለሰም';isCorrect=(user===q.correct);}else if(q.type==='fill'){correctText=q.correct;userText=user||'አልተመለሰም';isCorrect=(user&&user.trim().toLowerCase()===q.correct.trim().toLowerCase());}else{correctText=q.correct;userText=user||'አልተመለሰም';if(user&&q.keywords){let match=q.keywords.filter(kw=>user.toLowerCase().includes(kw.toLowerCase())).length;isCorrect=match/q.keywords.length>=0.5;}}if(isCorrect)totalScore+=q.weight;maxScore+=q.weight;let badge=isCorrect?'✓ ትክክል':'✗ ተሳስተዋል';detailsHtml+=`<div style="margin-bottom:15px;padding:10px;background:#f7fafc;border-radius:10px;"><strong>${q.num}. ${q.question}</strong><br>📝 መልስ: ${userText}<br>✅ ትክክለኛ: ${correctText}<br>${badge}<br>📖 ${q.page||''} | ${q.section||''}<br>💡 ${q.explanation||''}</div>`;}let percentage=(totalScore/maxScore)*100;let result={id:Date.now().toString(),studentName:currentExamineeData.name,examId:currentExamForStudent.id,examTitle:currentExamForStudent.title,score:totalScore,maxScore,percentage,detailsHtml,submittedAt:new Date().toISOString()};results.push(result);saveAll();document.getElementById('examScreen').classList.add('hidden');let passed=percentage>=50;document.getElementById('examLoginScreen').innerHTML=`<div class="card" style="margin:50px auto;"><h2 style="color:${passed?'#059669':'#dc2626'}">${passed?'🎉 አልፈዋል!':'📚 አላለፉም!'}</h2><div style="font-size:3rem;text-align:center;">${percentage.toFixed(1)}%</div><p>${totalScore}/${maxScore} ነጥብ</p><div style="max-height:400px;overflow:auto;">${detailsHtml}</div><button class="btn btn-primary" onclick="goBack()">🔁 ቀጥሎ</button></div>`;document.getElementById('examLoginScreen').classList.remove('hidden');loadResults();}
    
    loadAdminData();updateExamSelect();
</script>
</body>
</html>
